[package]
name = "real-time-zones"
version = "1.0.2"
description = "RealTimeZones - Cross-Timezone Meeting Planner"
authors = ["BitSharC"]
edition = "2021"

[lib]
name = "real_time_zones_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
